name: Bench

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Times the decode → p-code hot path (core/benches/decode.rs) on every push
  # and pull request. A pull request is compared against its base: the base is benched
  # first in the same job, on the same runner, and Criterion reports the change
  # per instruction. Shared runners are noisy, so the job reports and never
  # fails on a regression; read the summary, and rerun locally with
  # `--save-baseline`/`--baseline` before believing a small difference.
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out the open_sleigh submodule
        run: |
          git -c url.https://github.com/.insteadOf=git@github.com: \
            submodule update --init --recursive --depth=1
      - uses: dtolnay/rust-toolchain@stable

      - name: Check out the base
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
      - name: Check out the base's open_sleigh submodule
        if: github.event_name == 'pull_request'
        working-directory: base
        run: |
          git -c url.https://github.com/.insteadOf=git@github.com: \
            submodule update --init --recursive --depth=1

      - name: Bench the base
        id: base
        # The base has the bench only once it is on main; a pull request that
        # adds it is benched on its own.
        if: github.event_name == 'pull_request' && hashFiles('base/core/benches/decode.rs') != ''
        working-directory: base
        # The base builds in its own target directory: shared with the head's,
        # cargo reused the base's artifacts for the head and compared the base
        # with itself. Only Criterion's store is shared, so the head's run
        # finds the baseline.
        env:
          CRITERION_HOME: ${{ github.workspace }}/target/criterion
        run: |
          cargo bench -p wazabin-sleigh --bench decode -- --noplot --save-baseline base
          echo "compare=--baseline base" >> "$GITHUB_OUTPUT"

      - name: Bench
        env:
          CRITERION_HOME: ${{ github.workspace }}/target/criterion
        run: |
          cargo bench -p wazabin-sleigh --bench decode -- --noplot ${{ steps.base.outputs.compare }} \
            | tee bench.txt

      - name: Summary
        if: always()
        run: |
          {
            echo '## Decode bench'
            if [ -n "${{ steps.base.outputs.compare }}" ]; then
              echo "Head against base \`${{ github.event.pull_request.base.sha }}\`; a change is reported only outside the noise threshold."
            fi
            echo '```'
            grep -E '^[a-z]+/|time:|change:|Performance|No change' bench.txt || echo 'no results'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
