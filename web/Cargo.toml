[package]
name = "sleigh-web"
version = "0.0.0"
edition = "2024"
publish = false
description = "Browser playground for wazabin-sleigh, deployed at wazabin.github.io/sleigh"

# Standalone: keeps the published crates' Cargo.lock free of wasm-bindgen.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
sleigh = { package = "wazabin-sleigh", path = "../core" }
sleigh_precompile = { package = "wazabin-sleigh-precompile", path = "../precompile" }
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
